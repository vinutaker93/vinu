<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        width: 340px;
        margin: 0;
        padding: 12px;
        color: #202124;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 4px;
      }
      p.hint {
        font-size: 11px;
        color: #5f6368;
        margin: 0 0 10px;
      }
      textarea {
        width: 100%;
        height: 70px;
        box-sizing: border-box;
        font-family: monospace;
        font-size: 11px;
        resize: vertical;
      }
      .row-btns {
        display: flex;
        gap: 6px;
        margin: 6px 0 10px;
      }
      button {
        font-size: 12px;
        padding: 5px 8px;
        border: 1px solid #dadce0;
        background: #f8f9fa;
        border-radius: 4px;
        cursor: pointer;
      }
      button.primary {
        background: #1a73e8;
        color: #fff;
        border-color: #1a73e8;
      }
      #list {
        border-top: 1px solid #eee;
        max-height: 260px;
        overflow-y: auto;
      }
      .acct {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 0;
        border-bottom: 1px solid #f1f3f4;
        font-size: 12px;
      }
      .acct .email {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .acct .rec {
        font-size: 10px;
        color: #5f6368;
      }
      #status {
        font-size: 11px;
        color: #1a73e8;
        min-height: 14px;
        margin-top: 8px;
      }
      .warn {
        font-size: 10px;
        color: #a50e0e;
        margin-top: 8px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <h1>Gmail Autofill — a la demande</h1>
    <p class="hint">
      Un compte a la fois. Colle ta liste (une ligne par compte) au format
      <code>email;motdepasse;mailrecup</code>, puis Enregistrer.
    </p>
    <textarea id="importArea" placeholder="email;motdepasse;mailderecuperation"></textarea>
    <div class="row-btns">
      <button id="importBtn" class="primary">Enregistrer la liste</button>
      <button id="clearBtn">Vider</button>
    </div>
    <div id="list"></div>
    <div id="status"></div>
    <p class="warn">
      Le mail de recuperation est affiche pour que tu le tapes toi-meme quand
      Google le demande. L'extension ne le saisit pas et n'utilise aucun proxy.
    </p>
    <script src="popup.js"></script>
  </body>
</html>
